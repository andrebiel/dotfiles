# Use Catppuccin Mocha to match Ghostty and Neovim.
onboarding = false

[terminal]
default_shell = "/bin/zsh"
shell_mode = "login"
new_cwd = "follow"

[theme]
name = "catppuccin"

[keys]
prefix = "ctrl+space"
previous_workspace = "ctrl+alt+k"
next_workspace = "ctrl+alt+j"
new_tab = "prefix+c"
close_workspace = "prefix+d"
remove_worktree = "prefix+shift+d"
workspace_picker = ""
goto = "prefix+w"
new_worktree = "prefix+t"

[worktrees]
directory = "~/dev/worktrees"

[[keys.command]]
key = "prefix+shift+e"
type = "shell"
description = "open Neovim in a new tab"
command = '''
created=$("$HERDR_BIN_PATH" tab create --workspace "$HERDR_ACTIVE_WORKSPACE_ID" --cwd "$HERDR_ACTIVE_PANE_CWD" --label Neovim --no-focus) || exit 1
pane_id=$(printf '%s' "$created" | jq -er '.result.root_pane.pane_id') || exit 1
tab_id=$(printf '%s' "$created" | jq -er '.result.tab.tab_id') || exit 1
"$HERDR_BIN_PATH" pane run "$pane_id" nvim &&
  "$HERDR_BIN_PATH" tab focus "$tab_id"
'''

[[keys.command]]
key = "prefix+u"
type = "popup"
command = "ai-usage show"
description = "show AI usage"
width = "90%"
height = "85%"

[[keys.command]]
key = "prefix+f"
type = "popup"
command = "herdr-fuzzy-open"
description = "find and open files"
width = "85%"
height = "75%"

[[keys.command]]
key = "prefix+alt+g"
type = "popup"
command = "lazygit"
description = "open lazygit"
width = "90%"
height = "90%"

[ui]
sidebar_width = 32

[ui.sidebar.spaces]
rows = [["state_icon", "workspace", "branch", "git_status"]]
